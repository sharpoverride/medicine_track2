receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 100
    send_batch_max_size: 200

  # Transform to Application Insights schema attributes
  attributes:
    actions:
      - key: cloud.role.name
        action: insert
        from_attribute: service.name
      - key: cloud.role.instance
        action: insert
        from_attribute: service.instance.id

  # Add itemType for Application Insights compatibility
  resource:
    attributes:
      - key: itemType
        value: "trace"
        action: insert

exporters:
  # File exporter for telemetry data backup
  file:
    path: /var/otel/telemetry.json
    rotation:
      max_megabytes: 50
      max_days: 1
      max_backups: 3

  # Debug output for troubleshooting
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

  # ClickHouse exporter
  # Writes OTLP traces/logs/metrics directly into the local ClickHouse container.
  # The endpoint is overridden via env var ${env:CLICKHOUSE_ENDPOINT} injected by Aspire.
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    database: telemetry
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    metrics_table_name: otel_metrics
    ttl: 72h
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    create_schema: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [file, debug, clickhouse]

    logs:
      receivers: [otlp]
      processors: [batch, attributes, resource]
      exporters: [file, debug, clickhouse]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug, clickhouse]

  telemetry:
    logs:
      level: info
